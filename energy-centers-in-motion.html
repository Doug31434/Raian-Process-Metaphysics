<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Energy Centers in Motion</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a stage for projection. One live 3D center fills the room; its notes sit in a side panel that can be hidden; a rail of seven colors runs root to crown. */
:root{
  color-scheme:dark;
  --night:#0c0a12; --panel:#15121d; --ink:#ece7f3; --muted:#a69fb6; --rule:#2c2638; --c:#c8352b;
  --display:"Marcellus",Georgia,serif; --body:"Spectral",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow:hidden}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
.app.notes-off{grid-template-columns:minmax(0,1fr) 0}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule)}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:7px 12px;cursor:pointer}
button:hover{border-color:var(--c)}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.stage{position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 45%, color-mix(in srgb, var(--c) 14%, #0c0a12) 0%, #0c0a12 62%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.caption{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;right:16px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.bigname{font-family:var(--display);font-size:clamp(34px,6vw,64px);line-height:1;color:var(--c);text-shadow:0 0 30px color-mix(in srgb,var(--c) 40%,transparent)}
.bignum{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.hint{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.polar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.polar[hidden]{display:none}
.polar button{padding:8px 16px;font-size:13px;background:rgba(12,10,18,.6)}
.polar button[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 0 1px var(--c) inset;color:var(--ink)}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;padding:0;font-size:18px;background:rgba(12,10,18,.5)}
.arrow.prev{left:max(12px,env(safe-area-inset-left,0px))}.arrow.next{right:12px}
aside{background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;min-width:0;padding:22px 22px 28px max(22px,0px)}
.app.notes-off aside{display:none}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.1;margin:6px 0 4px;text-wrap:balance}
.sub{font-style:italic;color:var(--muted);margin:0 0 16px}
.form{border-left:3px solid var(--c);padding:4px 0 4px 14px;margin:0 0 18px;font-size:18.5px}
.lbl{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
q{font-style:italic;quotes:"\201C" "\201D"}
.cite{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
dl{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px 12px;margin:0 0 18px}
dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-top:5px}
dd{margin:0;min-width:0}
.archbox{background:color-mix(in srgb,var(--c) 12%,#1d1927);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.archbox .main{font-family:var(--display);font-size:21px;line-height:1.3;margin:2px 0 8px}
.archbox p{margin:0}
.render{font-size:14.5px;color:var(--muted);margin:0 0 14px}
.layers{font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px;margin:0}
#notes h2.sec{font-family:var(--body);font-weight:400;font-size:19px;margin:22px 0 8px;color:var(--c)}
#notes p.prose{font-size:15px;line-height:1.55;margin:0 0 10px}
nav.rail{grid-column:1/-1;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));border-top:1px solid var(--rule)}
nav.rail button{border:0;border-radius:0;padding:10px 4px 12px;display:grid;gap:4px;justify-items:center;text-transform:none;letter-spacing:0;font-family:var(--body);font-size:14px;color:var(--muted);border-top:3px solid transparent}
nav.rail button .dot{width:12px;height:12px;border-radius:50%;background:var(--dc);box-shadow:0 0 10px var(--dc)}
nav.rail button[aria-current="true"]{color:var(--ink);border-top-color:var(--dc);background:rgba(255,255,255,.03)}
@media (max-width:900px){
  body{overflow:auto}
  .app,.app.notes-off{height:auto;min-height:100%;grid-template-columns:1fr;grid-template-rows:auto 62vh auto auto}
  aside{border-left:0;border-top:1px solid var(--rule);padding:20px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
  nav.rail{grid-row:3}
  aside{grid-row:4}
  .hint{display:none}
  nav.rail button span.nm{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.bigname{text-shadow:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <div class="brand">Energy Centers in Motion<small>Ra's seven centers · live, rotatable forms</small></div>

</div>

 ,{key:'column', name:'All Seven', color:'#f4f2ec', num:'The seven in their flow', sub:'One upon the other, root to crown', dist:8.2, elev:6,
  html:`<div class="form"><span class="lbl">Ra · upward</span><q>The term “upward spiraling light” is an indication not of your up and down concept, but an indication of the concept of that which reaches towards the source of love and light.</q> <span class="cite">(59.11)</span></div>

    <p class="render"><span class="lbl">What you're seeing</span>All seven centers, one upon the other, beginning with red. Each membrane takes in at its root what the center below passes on at its neck, so the colors run into each other without a seam: red's neck is already orange, orange's root is still red. White light gathers into red's root from everywhere below, and above violet the light passes on as a white-gold column (an interpretation). In other words, one rising, seven ways of being shaped by it.</p>`},
 {key:'bash', name:'The Great BASH', color:'#b0443a', num:'The flow blocked', sub:'Bellicose Attitude, Aggressive Actions, Scarred and Scared, Hope through Hostility', dist:7.2, elev:8,
  html:`<h2 class="sec">What the Great BASH is</h2>
    <p class="prose">The Great BASH names the collective thoughtform of bellicosity that runs through human life: <b>B</b>ellicose Attitude (the world seen as threat, the other as enemy), <b>A</b>ggressive Actions (from manipulation to war, each blow confirming the expectation that called it forth), <b>S</b>carred and Scared (the unhealed wounds beneath it, so that hurt people hurt people), and <b>H</b>ope through Hostility (the old promise that peace will finally come once the right enemy is subdued). It has grown large enough to act with something like a life of its own, feeding on the fear it keeps alive. The term is not Ra's. Ra, speaking of a different class of thoughtforms, says <q>the thought-form entities feed upon fear</q> <span class="cite">(43.6)</span>, and the Great BASH can be read as fed the same way.</p>
    <h2 class="sec">The Law of Responsibility</h2>
    <dl><dt>Ra</dt><dd><q>By the end of the second cycle, the Law of Responsibility had begun to be effectuated by the increasing ability of entities to grasp those lessons which there are to be learned in this density. Thus, entities had discovered many ways to indicate a bellicose nature…</q> <span class="cite">(22.5)</span></dd>
    <dt>Ra</dt><dd><q>As each lesson was understood… each lesson could be rejected in practice. Without demonstrating the fruits of such learn/teaching the life span became greatly reduced</q> <span class="cite">(22.5)</span></dd>
    <dt>Patton</dt><dd><q>A decrease in harvestability due to the rejection of the Law or Way of Responsibility; that is, seeing universal love, yet still it fought on</q> <span class="cite">(34.17)</span></dd></dl>
    <p class="prose">In other words, the more we understand, the more we're answerable for living it. The Law of Responsibility and humanity's bellicose turn arrive together in Ra's account (22.5). This is the knowing-without-doing gap, and the Great BASH lives in it: we glimpse universal love, the lotus parts, and still we fight on.</p>
    <h2 class="sec">The inefficient use of bellicosity</h2>
    <dl><dt>Ra</dt><dd><q>It is incorrect that warfare of the types specific to your experiences was planned by the Logos. This form of expression of hostility is an interesting result which is apparently concomitant with the tool-making ability</q> <span class="cite">(90.18)</span></dd>
    <dt>Ra</dt><dd><q>In the case of your planetary sphere there is much inefficient use of catalyst</q> <span class="cite">(66.34)</span></dd>
    <dt>Balance</dt><dd>For the Sirius entities, who have no bellicose heritage, Ra says <q>it is then necessary to investigate movements of all kinds, especially bellicosity</q> <span class="cite">(38.9)</span></dd></dl>
    <p class="prose">Bellicosity in itself is a movement to be studied and balanced, catalyst like any other. Our Logos designed the experiment for the greatest possible opportunities for polarization, with <q>a bias towards kindness</q> <span class="cite">(90.21)</span>. Warfare of our kind wasn't planned. Used efficiently, conflict sharpens the choice. Used inefficiently, as on Earth, it neither clarifies nor resolves: it circles, compounds, and enmeshes. Ra speaks of the inefficient use of catalyst (66.34); "the inefficient use of bellicosity" names that same failure applied to bellicose catalyst. Forgiveness, <q>implicit in universal love</q> <span class="cite">(34.17)</span>, is what lets the stalled stream rise.</p>
    <p class="render"><span class="lbl">What you're seeing</span>Energy rises from red through orange into yellow, and there it stalls, falling back on itself short of the heart. Winding through all three is the Great BASH, a vortex that feeds on the very energy it keeps circling. Now and then the lotus at green parts for a moment and closes again: the Patton pattern, frequent green-ray openings that never hold. At the lotus's center the small orb is dull, smoky orange: humanity under the orange-ray overlay, before the heart's activation. This is Stage 1 of <i>The Green Ray in Six Stages</i>.</p>
    <p class="layers">Words in quotation marks with a session.question number are Ra's, from <i>The Ra Contact</i>. The Great BASH, its vortex shape, and "the inefficient use of bellicosity" are interpretive terms, not Ra's.</p>`}

      const y = o.y0 + (o.y1 - o.y0)*q.u, r = q.r*(1 + 0.35*Math.sin(q.u*14 + q.ph));
      pos[i*3] = r*Math.cos(q.ph); pos[i*3+1] = y; pos[i*3+2] = r*Math.sin(q.ph);
      const f = Math.min(1, q.u/0.05, (1 - q.u)/0.08); c.copy(o.col(y)).multiplyScalar(f*q.b*(o.gain || 1)); col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; }
    g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true; }; };
const axisColor = (stops) => (y) => { const c = new THREE.Color(); if (y <= stops[0][0]) return c.setHex(stops[0][1]); const L = stops.length - 1; if (y >= stops[L][0]) return c.setHex(stops[L][1]);
  for (let i=0;i<L;i++) if (y <= stops[i+1][0]) return c.setHex(stops[i][1]).lerp(new THREE.Color(stops[i+1][1]), (y - stops[i][0])/(stops[i+1][0] - stops[i][0])); return c; };
const tickCenter = (sub, dt, t) => { sub.userData.memb.userData.tick(dt); sub.userData.spin.rotation.y += dt*.18;
  const f = sub.userData.form; if (f.G.userData.tick) f.G.userData.tick(dt);
  if (f.mats && f.mats.length){ const k = 0.88 + 0.12*Math.sin(t*1.3); f.mats.forEach(m => { if (m.userData.fres) m.uniforms.k.value = k; else if (m.userData.op !== undefined) m.opacity = m.userData.op*k; }); } };
const makeCenter = (key) => { const root = new THREE.Group(); root.userData.memb = flowMembrane(root, key);
  const o = FORMS[key](), spin = new THREE.Group(); spin.add(o.G); root.add(spin); root.userData.spin = spin; root.userData.form = o; return root; };
function buildColumn(){
  const root = new THREE.Group(), SP = yNeck - yRoot, subs = [];

  const rise = makeRiser(root, {n:3200, y0:ys[0] + yBot - 0.6, y1:ys[6] + yTop + 0.9, r0:0.04, r1:0.45, sp:0.045, size:0.08, gain:0.55, col:axisColor(stops)});
  return {root, tick:(dt, t) => { subs.forEach(s => tickCenter(s, dt, t)); rise(dt, t); }}; }

// ---------- scene: the Great BASH blocking the flow (Stage 1 of The Green Ray in Six Stages) ----------
function buildBash(){
  const root = new THREE.Group(), W = new THREE.Group(); root.add(W); W.position.y = 0.62; W.scale.setScalar(0.9);
  const GY = 0.6, TY = [-2.6, -1.8, -1.0], yRootG = GY - 1.12*ONION_H;
  const triad = [buildRed(), buildOrange(), buildYellow()].map((o, i) => { const h = new THREE.Group(); h.position.y = TY[i]; h.add(o.G); W.add(h); return Object.assign(o, {h}); });
  { const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-3.1,0), new THREE.Vector3(0,GY+1.4,0)]); W.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:0x8a6a2c, transparent:true, opacity:0.18}))); }
  const colAtY = (y) => { const st = [[-2.6,0xd2382c],[-1.8,0xe8802a],[-1.0,0xe2c830],[yRootG,0xa8d838],[GY,0x2fb45e]], c = new THREE.Color();
    if (y <= st[0][0]) return c.setHex(st[0][1]); if (y >= st[4][0]) return c.setHex(st[4][1]);
    for (let i=0;i<4;i++) if (y <= st[i+1][0]) return c.setHex(st[i][1]).lerp(new THREE.Color(st[i+1][1]), (y-st[i][0])/(st[i+1][0]-st[i][0])); return c; };
  // the stalled stream, recirculating below green
  const SN = 2400, spos = new Float32Array(SN*3), scol = new Float32Array(SN*3), SP = [];
  for (let i=0;i<SN;i++) SP.push({th:Math.random()*Math.PI*2, ph:Math.random()*Math.PI*2, j:0.7 + 0.6*Math.random(), sp:0.35 + 0.25*Math.random(), w:Math.random()});
  const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.BufferAttribute(spos,3)); sg.setAttribute('color', new THREE.BufferAttribute(scol,3));
  W.add(new THREE.Points(sg, pointsMat(0.11)));
  // the Great BASH: a vortex enmeshed with the lower triad
  const B = new THREE.Group(); W.add(B); const NS = 9, NP = 160, tilt = new THREE.Euler(0.16, 0, -0.12);
  const at = (s, t) => { const y = -0.45 - 2.85*t, r = 0.18 + 1.35*Math.pow(1 - t, 1.25), ang = s*Math.PI*2/NS + 7.5*Math.PI*t, wob = 0.12*Math.sin(t*9 + s);
    return new THREE.Vector3((r + wob)*Math.cos(ang) + 0.18*Math.sin(t*4), y, (r + wob)*Math.sin(ang)).applyEuler(tilt); };
  const lineMat = new THREE.LineBasicMaterial({vertexColors:true, transparent:true, opacity:0.7, depthWrite:false});

      const c = new THREE.Color(0x9a3a2c).lerp(new THREE.Color(0x6e5468), 0.5 + 0.5*Math.sin(t*6 + s)); cols.push(c.r, c.g, c.b); }
    const g = new THREE.BufferGeometry().setFromPoints(pts); g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3)); B.add(new THREE.Line(g, lineMat)); }
  const haze = glowSprite(0x6a2a24, 3.2, 0.22); haze.position.set(0, -1.7, 0); haze.scale.set(2.6, 3.6, 1); B.add(haze);
  const BN = 700, bpos = new Float32Array(BN*3), bcol = new Float32Array(BN*3), BP = [];
  for (let i=0;i<BN;i++) BP.push({s:Math.floor(Math.random()*NS), t:Math.random(), sp:0.05 + 0.05*Math.random(), o:(Math.random()-0.5)*0.1});
  const bg = new THREE.BufferGeometry(); bg.setAttribute('position', new THREE.BufferAttribute(bpos,3)); bg.setAttribute('color', new THREE.BufferAttribute(bcol,3));
  B.add(new THREE.Points(bg, pointsMat(0.08)));
  // green above, its membrane faint, its lotus closed, the small orb dull and smoky orange
  const green = new THREE.Group(); green.position.y = GY; W.add(green);
  const gm = flowMembrane(green, 'green'); gm.children[0].material.uniforms.op.value = 0.09; gm.children[1].visible = false;
  const setLotus = lotusOf(green);
  smallOrb(green, 0x9a5a2c);
  const smoke = glowSprite(0x5e4a40, 0.5, 0.5); smoke.material.blending = THREE.NormalBlending; green.add(smoke);
  const dglow = glowSprite(0x9a5a2c, 0.4, 0.15); green.add(dglow);
  const c = new THREE.Color(), dull = new THREE.Color(0x8a3c30);
  const tick = (dt, t) => {
    triad.forEach((o, i) => { const f = 1.15*(0.88 + 0.12*Math.sin(t*1.3 + i*1.7))*(1 - 0.15*(0.5 + 0.5*Math.sin(t*2.1 + i)));
      o.mats.forEach(m => { if (m.userData.fres) m.uniforms.k.value = f; else m.opacity = m.userData.op*f; }); o.h.rotation.y += dt*0.1; });
    for (let i=0;i<SN;i++){ const p = SP[i]; p.th = (p.th + dt*p.sp) % (Math.PI*2); p.ph += dt*0.12;
      const r = (0.42 - 0.38*Math.cos(p.th))*p.j, y = -1.75 + Math.sin(p.th)*(0.9 + 0.1*p.j);
      spos[i*3] = r*Math.cos(p.ph); spos[i*3+1] = y; spos[i*3+2] = r*Math.sin(p.ph);
      c.copy(colAtY(y)).multiplyScalar(0.22 + 0.2*p.w); scol[i*3] = c.r; scol[i*3+1] = c.g; scol[i*3+2] = c.b; }
    sg.attributes.position.needsUpdate = true; sg.attributes.color.needsUpdate = true;
    B.rotation.y -= dt*0.12;
    for (let i=0;i<BN;i++){ const p = BP[i]; p.t = (p.t + dt*p.sp) % 1; const v = at(p.s, p.t);

      c.copy(colAtY(v.y)).lerp(dull, 0.55).multiplyScalar(0.8); bcol[i*3] = c.r; bcol[i*3+1] = c.g; bcol[i*3+2] = c.b; }

// ---------- scene: violet at the entrance to fourth density, positive and negative (33.19) ----------
let polarNeg = 0;   // 0 positive, 1 negative (the toggle)
function buildPolarity(){
  const root = new THREE.Group(), EY = 1.55;   // the aura: an egg, taller than wide, around the whole being
  const rimShell = (hex, r, pw, a) => { const m = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
      uniforms:{c:{value:new THREE.Color(hex)}, k:{value:1}}, vertexShader:orbVS,
      fragmentShader:`uniform vec3 c; uniform float k; varying vec3 vN; varying vec3 vV; void main(){ float f = 1.0 - max(dot(vN, vV), 0.0); gl_FragColor = vec4(c, (0.03 + pow(f, ${pw.toFixed(1)})*${a.toFixed(2)})*k); }` });
    const me = new THREE.Mesh(new THREE.SphereGeometry(r, 72, 54), m); me.scale.y = EY; root.add(me); return m; };
  // the seven centers along the axis, small, root to crown
  const axisG = new THREE.Group(); root.add(axisG);
  ['red','orange','yellow','green','blue','indigo','violet'].forEach((k, i) => { const y = -1.5 + i*0.5, c = HEX[k];
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.07, 24, 16), new THREE.MeshBasicMaterial({color:c})); m.position.y = y; axisG.add(m);
    const g = glowSprite(c, 0.45, 0.7); g.position.y = y; axisG.add(g); });
  { const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,-1.75,0), new THREE.Vector3(0,1.75,0)]); axisG.add(new THREE.Line(g, new THREE.LineBasicMaterial({color:0xd8c8f0, transparent:true, opacity:0.25}))); }
  // the all-encompassing violet aura, the same for both paths
  const VR = 1.45; rimShell(0x9050c0, VR, 2.6, 0.75); rimShell(0xb46ae6, VR*1.04, 4.0, 0.5);
  const mkPts = (N, size) => { const pos = new Float32Array(N*3), col = new Float32Array(N*3), g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos,3)); g.setAttribute('color', new THREE.BufferAttribute(col,3));
    const m = pointsMat(size), p = new THREE.Points(g, m); root.add(p); return {pos, col, g, m, p, N}; };
  const V = mkPts(1400, 0.04), VP = [], vc = new THREE.Color(0xb46ae6);
  for (let i=0;i<V.N;i++) VP.push({u:Math.random()*2-1, th:Math.random()*Math.PI*2, sp:0.05 + 0.08*Math.random(), r:VR*(0.98 + 0.06*Math.random())});
  // positive: within the violet, green, blue and indigo as bright, quite distinct bands, a portion of a rainbow
  const BANDS = [[0x2dff8a, 1.02], [0x2f8fff, 1.16], [0x6a4dff, 1.30]];
  const pRims = []; BANDS.forEach(([c, r]) => [-0.035, 0, 0.035].forEach(d => pRims.push(rimShell(c, r + d, 4.0, 1.5))));
  const P = mkPts(5400, 0.065), PP = [];
  for (let i=0;i<P.N;i++) PP.push({b:i%3, d:(Math.random()-0.5)*0.08, u:Math.random()*2-1, th:Math.random()*Math.PI*2, sp:0.08 + 0.08*Math.random()});
  // negative: within the violet, red, orange and yellow, muddied rather than distinct
  const nRims = [[0x8a3a26, 1.06], [0x96582a, 1.12], [0x8a7a30, 1.18], [0x4a3628, 1.25]].map(([c, r]) => rimShell(c, r, 1.3, 0.45));
  const N = mkPts(3200, 0.055), NP = [], MUD = new THREE.Color(0x4a3628), NCOL = [0xd2382c, 0xe8802a, 0xe2c830].map(h => new THREE.Color(h));
  for (let i=0;i<N.N;i++){ const c = NCOL[Math.floor(Math.random()*3)].clone().lerp(NCOL[Math.floor(Math.random()*3)], Math.random()).lerp(MUD, 0.35 + 0.3*Math.random());
    NP.push({r:0.95 + 0.38*Math.random(), u:Math.random()*2-1, th:Math.random()*Math.PI*2, sp:(Math.random()-0.5)*0.5, ph:Math.random()*6.28, c}); }
  const smokes = []; for (let i=0;i<9;i++){ const sm = glowSprite(0x3a2a20, 1.6, 0.3); sm.material.blending = THREE.NormalBlending; root.add(sm); smokes.push({s:sm, a:i/9*Math.PI*2, y:-1.4 + 2.8*i/8}); }
  let w = 0, t = 0; const c = new THREE.Color();
  const onEgg = (arr, i, r, u, th) => { const sq = Math.sqrt(Math.max(0, 1 - u*u)); arr[i*3] = r*sq*Math.cos(th); arr[i*3+1] = r*u*EY; arr[i*3+2] = r*sq*Math.sin(th); };
  const PK = ['red','orange','yellow','green','blue','indigo','violet'];
  const rise = makeRiser(root, {n:2600, y0:-2.0, y1:2.15, r0:0.03, r1:0.22, sp:0.06, size:0.075,
    col:axisColor([[-2.0, HEX.white], ...PK.map((k, i) => [-1.5 + i*0.5, HEX[k]]), [2.15, HEX.wgold]])});
  const tick = (dt) => { t += dt; w += (polarNeg - w)*(1 - Math.exp(-dt*2.5)); const pw = 1 - w; rise(dt, t);
    axisG.rotation.y += dt*0.1;
    for (let i=0;i<V.N;i++){ const q = VP[i]; q.th += dt*q.sp; onEgg(V.pos, i, q.r, q.u, q.th); V.col[i*3] = vc.r; V.col[i*3+1] = vc.g; V.col[i*3+2] = vc.b; }
    V.g.attributes.position.needsUpdate = true; V.g.attributes.color.needsUpdate = true;
    pRims.forEach(m => m.uniforms.k.value = pw); P.m.opacity = pw; P.p.visible = pw > 0.01;
    if (P.p.visible){ for (let i=0;i<P.N;i++){ const q = PP[i]; q.th += dt*q.sp; onEgg(P.pos, i, BANDS[q.b][1] + q.d, q.u, q.th); c.setHex(BANDS[q.b][0]); P.col[i*3] = c.r; P.col[i*3+1] = c.g; P.col[i*3+2] = c.b; }
      P.g.attributes.position.needsUpdate = true; P.g.attributes.color.needsUpdate = true; }
    nRims.forEach(m => m.uniforms.k.value = w*(0.85 + 0.15*Math.sin(t*1.7))); N.m.opacity = w; N.p.visible = w > 0.01;
    smokes.forEach((o, i) => { o.a += dt*0.12; o.s.position.set(1.1*Math.cos(o.a), o.y + 0.2*Math.sin(t*0.4 + i), 1.1*Math.sin(o.a)); o.s.material.opacity = 0.3*w; o.s.visible = w > 0.01; });
    if (N.p.visible){ for (let i=0;i<N.N;i++){ const q = NP[i]; q.th += dt*q.sp; q.ph += dt*0.7; onEgg(N.pos, i, q.r + 0.08*Math.sin(q.ph + q.th*3), Math.max(-1, Math.min(1, q.u + 0.05*Math.sin(q.ph*1.3))), q.th);
        N.col[i*3] = q.c.r; N.col[i*3+1] = q.c.g; N.col[i*3+2] = q.c.b; }
      N.g.attributes.position.needsUpdate = true; N.g.attributes.color.needsUpdate = true; } };
  return {root, tick}; }
const tickCenterForm = (spin, f, dt, t) => { spin.rotation.y += dt*.18; if (f.G.userData.tick) f.G.userData.tick(dt);
  if (f.mats && f.mats.length){ const k = 0.88 + 0.12*Math.sin(t*1.3); f.mats.forEach(m => { if (m.userData.fres) m.uniforms.k.value = k; else if (m.userData.op !== undefined) m.opacity = m.userData.op*k; }); } };

const SCENES = CENTERS.filter(ct => !ct.html).map(ct => { const root = makeCenter(ct.key); return {root, tick:(dt, t) => tickCenter(root, dt, t)}; });
SCENES.push(buildColumn(), buildBash(), buildPolarity());
SCENES.forEach(sc => { sc.root.visible = false; scene.add(sc.root); });
const NSC = SCENES.length;

function size(){ const st = $('stage'); const w = st.clientWidth, h = st.clientHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix();
  PT_SCALE.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y/(2*Math.tan(camera.fov*Math.PI/360)); }
window.addEventListener('resize', size);
new ResizeObserver(size).observe($('stage'));

function resetView(){ const ct = CENTERS[idx], e = (ct.elev !== undefined ? ct.elev : (ct.key === 'green' ? 9 : 14))*Math.PI/180, az = Math.PI/4, dist = ct.dist || 4.3;
  camera.position.set(dist*Math.cos(e)*Math.sin(az), Math.sin(e)*dist, dist*Math.cos(e)*Math.cos(az)); controls.target.set(0,0,0); controls.update(); }

// ---------- notes ----------
function renderNotes(){
  const ct = CENTERS[idx];
  document.documentElement.style.setProperty('--c', ct.color);
  $('bignum').textContent = ct.num; $('bigname').textContent = ct.name;
  if (ct.html) notes.innerHTML = `<div class="eyebrow">${ct.num}</div><h1>${ct.name}</h1><p class="sub">${ct.sub}</p>${ct.html}`;
  else notes.innerHTML = `
    <div class="eyebrow">${ct.num}</div>
    <h1>${ct.name}</h1>
    <p class="sub">${ct.sub}</p>
    <div class="form"><span class="lbl">Ra · the form</span><q>${ct.form}</q> <span class="cite">(51.8)</span></div>
    <dl>${ct.ra.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
    <div class="archbox"><span class="lbl">Archetype</span><p class="main">${ct.arch}</p><p><span class="lbl" style="display:inline">In every ray</span> ${ct.purview}</p></div>
    <p class="render"><span class="lbl">What you're seeing</span>${ct.render} Around it, the flow membrane: light rising south to north, received at the root from the center below and passed on at the neck to the center above.</p>
    <p class="layers">Words in quotation marks with a session.question number are Ra's, from <i>The Ra Contact</i>. The archetypes are working definitions. The three-dimensional forms are renderings of Ra's brief words in 51.8, shaped by interpretation.</p>`;
  [...rail.children].forEach((b,i) => b.setAttribute('aria-current', i===idx ? 'true' : 'false'));
}
CENTERS.forEach((ct,i) => { const b = document.createElement('button'); b.type = 'button'; b.style.setProperty('--dc', ct.color);
  b.innerHTML = `<span class="dot"></span><span class="nm">${ct.name}</span>`; b.addEventListener('click', () => go(i)); rail.appendChild(b); });

function setPolar(n){ polarNeg = n; $('polPos').setAttribute('aria-pressed', String(!n)); $('polNeg').setAttribute('aria-pressed', String(!!n)); }
function go(i, fromHash){ idx = (i + NSC) % NSC; $('polar').hidden = !CENTERS[idx].toggle; SCENES.forEach((g,k) => g.root.visible = k===idx); renderNotes(); resetView();
  if (!fromHash){ try { history.replaceState(null, '', '#' + CENTERS[idx].key); } catch(e){ location.hash = CENTERS[idx].key; } } }
function fromHash(){ const k = location.hash.slice(1); const i = CENTERS.findIndex(c => c.key === k); go(i >= 0 ? i : 0, true); }
window.addEventListener('hashchange', fromHash);

// ---------- controls ----------
let spinning = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const spinBtn = $('spinBtn'); spinBtn.textContent = spinning ? 'Pause' : 'Play'; spinBtn.setAttribute('aria-pressed', String(spinning));
spinBtn.onclick = () => { spinning = !spinning; spinBtn.textContent = spinning ? 'Pause' : 'Play'; spinBtn.setAttribute('aria-pressed', String(spinning)); };
const notesBtn = $('notesBtn');
function toggleNotes(){ const off = app.classList.toggle('notes-off'); notesBtn.textContent = off ? 'Show notes' : 'Hide notes'; notesBtn.setAttribute('aria-pressed', String(!off)); requestAnimationFrame(size); }
notesBtn.onclick = toggleNotes;
$('resetBtn').onclick = resetView;
$('polPos').onclick = () => setPolar(0); $('polNeg').onclick = () => setPolar(1);
$('prevBtn').onclick = () => go(idx-1); $('nextBtn').onclick = () => go(idx+1);
function fullscreen(){ const el = document.documentElement; try { if (!document.fullscreenElement) { const p = el.requestFullscreen && el.requestFullscreen(); if (p && p.catch) p.catch(()=>{}); } else document.exitFullscreen(); } catch(e){} }
$('fsBtn').onclick = fullscreen;
window.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(idx+1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(idx-1); }
  else if (/^[1-9]$/.test(e.key) && +e.key <= NSC) go(+e.key - 1);
  else if (e.key === '0' && NSC >= 10) go(9);
  else if ((e.key === 'p' || e.key === 'P') && CENTERS[idx].toggle) setPolar(polarNeg ? 0 : 1);
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if (e.key === 'f' || e.key === 'F') fullscreen();
  else if (e.key === 'r' || e.key === 'R') resetView();
});

// ---------- animation ----------
const clock = new THREE.Clock(); let t = 0;
function frame(){
  const dt = Math.min(clock.getDelta(), .05);
  if (spinning){ t += dt; TIME.value = t; SCENES[idx].tick(dt, t); }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
