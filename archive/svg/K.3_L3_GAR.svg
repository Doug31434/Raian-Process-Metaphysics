<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550">
  <!-- Background -->
  <rect width="900" height="550" fill="white"/>

  <!-- Title -->

<text x="450" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">GAR Teleopotentiation: The First Primal Paradox</text>

  <!-- Affirming Force Box (Top center) -->

  <rect x="270" y="70" width="300" height="90" fill="white" stroke="#000000" stroke-width="2" rx="3"/>
  <text x="420" y="95" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">AFFIRMING FORCE</text>
  <text x="420" y="113" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#cc0000">Primal Unity</text>
  <line x1="290" y1="120" x2="550" y2="120" stroke="#333" stroke-width="1"/>
  <text x="420" y="138" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Keter/Original Thought +</text>
  <text x="420" y="152" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Keter-Hochma/Original Desire</text>

  <!-- Denying Force Box (Bottom center) -->

  <rect x="270" y="390" width="300" height="90" fill="white" stroke="#000000" stroke-width="2" rx="3"/>
  <text x="420" y="415" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#333">DENYING FORCE</text>
  <text x="420" y="433" font-family="Arial, sans-serif" font-size="11" font-style="italic" text-anchor="middle" fill="#cc0000">Eternal Pulse</text>
  <line x1="290" y1="440" x2="550" y2="440" stroke="#333" stroke-width="1"/>
  <text x="420" y="458" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Creative Advance refusing terminus</text>
  <text x="420" y="472" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="#666">(The pulse that refuses to stop)</text>

  <!-- Diamond structure - four lines forming diamond shape -->

  <!-- Left Triangle - two lines -->

  <line x1="285" y1="275" x2="420" y2="160" stroke="#000066" stroke-width="3"/>
  <line x1="285" y1="275" x2="420" y2="390" stroke="#000066" stroke-width="3"/>

  <!-- Right Triangle - two lines -->

  <line x1="420" y1="160" x2="555" y2="275" stroke="#000066" stroke-width="3"/>
  <line x1="420" y1="390" x2="555" y2="275" stroke="#000066" stroke-width="3"/>

  <!-- Reconciling Force Label (Center) -->

<text x="420" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">RECONCILING FORCE</text>
<text x="420" y="263" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Joy as quality-in-transition:</text>
<text x="420" y="277" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Satisfaction achieved yet Pulse continues</text>
<text x="420" y="295" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="#666">(Whitehead: “perishing of immediacy”</text>
<text x="420" y="308" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="#666">as gift rather than loss)</text>

  <!-- Tension Box (Left) -->

  <rect x="140" y="215" width="145" height="120" fill="none" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,3" rx="3"/>
  <text x="212" y="245" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#cc0000">Tension</text>
  <line x1="155" y1="252" x2="270" y2="252" stroke="#cc0000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="212" y="270" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Perfect reception</text>
  <text x="212" y="284" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">achieved—yet creative</text>
  <text x="212" y="298" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">advance continues.</text>
  <text x="212" y="316" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Unbounded must</text>
  <text x="212" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">become bounded.</text>

  <!-- New Higher Arising Box (Right) - BLUE OUTLINE -->

  <rect x="555" y="185" width="185" height="180" fill="none" stroke="#000066" stroke-width="2" rx="3"/>
  <text x="647" y="213" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">NEW HIGHER</text>
  <text x="647" y="229" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#333">ARISING</text>
  <line x1="570" y1="237" x2="725" y2="237" stroke="#000066" stroke-width="1"/>
  <text x="647" y="255" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">Binah - First bounded</text>
  <text x="647" y="273" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#333">structure, holy finity</text>
  <line x1="570" y1="283" x2="725" y2="283" stroke="#000066" stroke-width="0.5"/>
  <text x="647" y="303" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="#666">Ra 13.12: "The concept</text>
  <text x="647" y="317" font-family="Arial, sans-serif" font-size="9" font-style="italic" text-anchor="middle" fill="#666">was finity"</text>
  <text x="647" y="340" font-family="Arial, sans-serif" font-size="8" font-style="italic" text-anchor="middle" fill="#666">(Unbounded becomes</text>
  <text x="647" y="352" font-family="Arial, sans-serif" font-size="8" font-style="italic" text-anchor="middle" fill="#666">capable of boundary)</text>

  <!-- Upper dashed arrow -->

  <line x1="370" y1="160" x2="290" y2="220" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="290,220 293,208 300,214" fill="#cc0000"/>

  <!-- Lower dashed arrow -->

  <line x1="370" y1="390" x2="290" y2="330" stroke="#cc0000" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="290,330 300,336 293,342" fill="#cc0000"/>

  <!-- Footer note -->

<text x="450" y="535" font-family="Arial, sans-serif" font-size="10" font-style="italic" text-anchor="middle" fill="#666">Raian Metaphysics Project - Kabbalah Integration - November 2025</text>
</svg>