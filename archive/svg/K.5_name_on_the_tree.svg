<text x="540" y="205" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420" font-weight="bold">tip of Yod</text>
<text x="540" y="223" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Keter</text>
<text x="1260" y="330" text-anchor="middle" font-family="'FreeSerif','DejaVu Sans',serif" font-size="78" fill="#b8860b" font-weight="bold">י</text>
<text x="1260" y="360" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420" font-weight="bold">Yod</text>
<text x="1260" y="378" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Chokhmah</text>
<text x="60" y="330" text-anchor="middle" font-family="'FreeSerif','DejaVu Sans',serif" font-size="78" fill="#b8860b" font-weight="bold">ה</text>
<text x="60" y="360" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420" font-weight="bold">Heh</text>
<text x="60" y="378" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Binah</text>
<text x="70" y="800" text-anchor="middle" font-family="'FreeSerif','DejaVu Sans',serif" font-size="96" fill="#b8860b" font-weight="bold">ו</text>
<text x="70" y="830" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420" font-weight="bold">Vav = 6</text>
<text x="70" y="848" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">the six of</text>
<text x="70" y="866" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Zeir Anpin,</text>
<text x="70" y="884" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Chesed–Yesod</text>
<text x="70" y="902" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">(the Son)</text>
<text x="520" y="1185" text-anchor="middle" font-family="'FreeSerif','DejaVu Sans',serif" font-size="78" fill="#b8860b" font-weight="bold">ה</text>
<text x="520" y="1215" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420" font-weight="bold">final Heh</text>
<text x="520" y="1233" text-anchor="middle" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Malkhut</text>
<text x="970" y="1040" text-anchor="end" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#b8860b" font-style="italic">Zeir Anpin · the Vav</text>
<line x1="80" y1="1286" x2="1240" y2="1286" stroke="#c9bba8"/>
<circle cx="102" cy="1312" r="11" fill="#fbf1d3" stroke="#b8860b" stroke-width="3"/>
<text x="122" y="1317" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420">YHWH names (Tiferet is the name's own seat)</text>
<circle cx="532" cy="1312" r="11" fill="#dcefef" stroke="#1f6f78" stroke-width="3"/>
<text x="552" y="1317" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420">Elohim names</text>
<circle cx="962" cy="1312" r="11" fill="#dcefef" stroke="#1f6f78" stroke-width="3"/><circle cx="962" cy="1312" r="16" fill="none" stroke="#b8860b" stroke-width="2"/>
<text x="986" y="1317" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420">both (Binah)</text>
<text x="80" y="1360" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="14" fill="#7a6e64">Letters: tip of Yod = Keter · Yod = Chokhmah (Abba) · Heh = Binah (Imma) · Vav = the six of Zeir Anpin (the Son) · final Heh = Malkhut (the Shekhinah).</text>
<text x="80" y="1382" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="14" fill="#7a6e64">Divine names by sefirah follow the standard list (Hod's Elohim Tzeva'ot is the common later assignment). The Zohar (1:15a) names Binah Elohim, and builds</text>
<text x="80" y="1404" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="14" fill="#7a6e64">Elohim from Mi (“who,” the hidden Keter–Chokhmah held in Binah) + Eleh (“these,” what goes out from her) — Isaiah 40:26, read in the Zohar's Introduction.</text>
<text x="80" y="1426" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="14" fill="#7a6e64">YHWH is Elohim (Deut. 4:35): the yichud, the union of the Holy One (Tiferet, Vav) with the Shekhinah (Malkhut, final Heh), makes the name whole.</text>
</svg>