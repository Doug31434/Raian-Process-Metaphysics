<text x="728" y="1186" text-anchor="start" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#2b2420" font-style="italic">Adonai</text>
<text x="728" y="1206" text-anchor="start" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">Shekhinah · the Daughter, the Bride</text>
