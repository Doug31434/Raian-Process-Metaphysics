<text x="998" y="606" text-anchor="start" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">mercy</text>
<text x="322" y="564" text-anchor="end" font-family="'FreeSerif','DejaVu Sans',serif" font-size="21" fill="#1f6f78">אלהים</text>
<text x="322" y="586" text-anchor="end" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="15" fill="#1f6f78" font-style="italic">Elohim</text>
<text x="322" y="606" text-anchor="end" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">judgment</text>
<text x="732" y="686" font-family="'FreeSerif','DejaVu Sans',serif" font-size="26" fill="#b8860b" font-weight="bold">יהוה</text>
<text x="732" y="710" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="17" fill="#b8860b" font-weight="bold">YHWH · the heart</text>
<text x="732" y="729" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">the Holy One, blessed be He</text>
<text x="732" y="745" font-family="'Liberation Serif','FreeSerif',Georgia,serif" font-size="13" fill="#7a6e64">mercy and judgment reconciled</text>
<text x="998" y="864" text-anchor="start" font-family="'FreeSerif','DejaVu Sans',serif" font-size="21" fill="#b8860b">יהוה צבאות</text>
