<svg viewBox="-100 -50 1000 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="-100" y="-50" width="1000" height="900" fill="#0a0a1a"/>
  
  <!-- Outer toroidal rings around SSAN/Singularity - ORANGE -->
  <ellipse cx="400" cy="100" rx="350" ry="200" fill="none" stroke="rgba(255,180,80,0.3)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="320" ry="180" fill="none" stroke="rgba(255,190,90,0.4)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="290" ry="160" fill="none" stroke="rgba(255,200,100,0.5)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="260" ry="140" fill="none" stroke="rgba(255,210,110,0.6)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="230" ry="120" fill="none" stroke="rgba(255,220,120,0.7)" stroke-width="2"/>
  
  <!-- Lower jet (PURPLE) - Repositioned with wider ends to match outer purple ellipse -->
  <!-- Inside sphere: lower node to crown -->
  <path d="M 400 825 L 385 635 L 400 635 L 415 635 L 400 825" 
        fill="rgba(180,100,255,0.15)" stroke="rgba(190,120,255,0.4)" stroke-width="5"/>
  <path d="M 400 825 Q 385 730 370 635" 
        fill="none" stroke="rgba(200,140,255,0.5)" stroke-width="6"/>
  <path d="M 400 825 Q 415 730 430 635" 
        fill="none" stroke="rgba(200,140,255,0.5)" stroke-width="6"/>
  
  <!-- Outside sphere: crown to SSAN - widened to match outer purple ellipse -->
  <path d="M 370 635 L 280 100 L 400 100 L 520 100 L 430 635" 
        fill="rgba(180,100,255,0.25)" stroke="rgba(190,120,255,0.6)" stroke-width="3"/>
  <path d="M 370 635 Q 325 367.5 280 100" 
        fill="none" stroke="rgba(200,140,255,0.7)" stroke-width="4"/>
  <path d="M 430 635 Q 475 367.5 520 100" 
        fill="none" stroke="rgba(200,140,255,0.7)" stroke-width="4"/>
  
  <!-- Blue emanation lines (INNER) - centered in epicenter -->
  <!-- Inside sphere: lower node to crown -->
  <path d="M 400 825 Q 392 730 385 635" 
        fill="none" stroke="rgba(0,127,255,0.6)" stroke-width="4"/>
  <path d="M 400 825 Q 408 730 415 635" 
        fill="none" stroke="rgba(0,127,255,0.6)" stroke-width="4"/>
  
  <!-- Outside sphere: crown to SSAN - matching inner azure ellipse -->
  <path d="M 385 635 Q 342.5 367.5 300 100" 
        fill="none" stroke="rgba(0,127,255,0.8)" stroke-width="4"/>
  <path d="M 415 635 Q 457.5 367.5 500 100" 
        fill="none" stroke="rgba(0,127,255,0.8)" stroke-width="4"/>
  
  <!-- Purple surrounding SSAN cavity -->
  <ellipse cx="400" cy="100" rx="100" ry="55" 
           fill="none" stroke="rgba(0,127,255,0.6)" stroke-width="3"/>
  <ellipse cx="400" cy="100" rx="120" ry="65" 
           fill="none" stroke="rgba(180,120,255,0.5)" stroke-width="4"/>
  
  <!-- Sun representation - Large curved surface extending to bottom - SOFT VIOLET -->
  <path d="M -100 650 Q 400 550 900 650 L 900 900 L -100 900 Z" 
        fill="rgba(180,140,220,0.9)" stroke="rgba(190,150,230,0.8)" stroke-width="3"/>
  <path d="M -100 660 Q 400 560 900 660" 
        fill="rgba(190,150,230,0.8)" stroke="rgba(200,160,240,0.7)" stroke-width="2"/>
  
  <!-- Solar corona/atmosphere glow - VIOLET -->
  <path d="M -100 650 Q 400 550 900 650" 
        fill="none" stroke="rgba(190,150,230,0.4)" stroke-width="20"/>
  <path d="M -100 650 Q 400 550 900 650" 
        fill="none" stroke="rgba(200,160,240,0.3)" stroke-width="35"/>
  <path d="M -100 650 Q 400 550 900 650" 
        fill="none" stroke="rgba(210,170,250,0.2)" stroke-width="50"/>
  
  <!-- Solar surface detail/texture - VIOLET -->
  <ellipse cx="400" cy="600" rx="300" ry="60" 
           fill="none" stroke="rgba(160,120,200,0.3)" stroke-width="2"/>
  <ellipse cx="400" cy="620" rx="250" ry="45" 
           fill="none" stroke="rgba(160,120,200,0.2)" stroke-width="2"/>
  <ellipse cx="400" cy="700" rx="280" ry="50" 
           fill="none" stroke="rgba(160,120,200,0.25)" stroke-width="2"/>
  <ellipse cx="400" cy="780" rx="320" ry="55" 
           fill="none" stroke="rgba(160,120,200,0.2)" stroke-width="2"/>
  
  <defs>
    <radialGradient id="cavitySphere" cx="50%" cy="15%">
      <stop offset="0%" style="stop-color:rgba(100,150,255,0.7);stop-opacity:1" />
      <stop offset="60%" style="stop-color:rgba(150,100,230,0.8);stop-opacity:1" />
      <stop offset="85%" style="stop-color:rgba(140,60,200,0.85);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(120,40,180,0.9);stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Main spherical cavity body -->
  <circle cx="400" cy="730" r="110"
          fill="url(#cavitySphere)"
          stroke="rgba(140,80,200,0.8)" stroke-width="3"/>
  
  <!-- Blue glow on surface of sphere (top) - dark blue to match text -->
  <ellipse cx="400" cy="635" rx="55" ry="30"
          fill="rgba(0,0,139,0.7)"
          stroke="rgba(0,0,100,0.8)" stroke-width="2"/>
  
  <!-- Lower node (deepest point - magenta outer glow) -->
  <circle cx="400" cy="825" r="20"
          fill="rgba(180,100,180,0.5)"
          stroke="rgba(160,80,160,0.7)" stroke-width="2"/>
  
  <!-- Deep dark magenta core -->
  <circle cx="400" cy="825" r="10"
          fill="rgba(100,0,100,0.9)"/>
  <circle cx="400" cy="825" r="5"
          fill="rgba(80,0,80,1)"/>
  
  <!-- Upper cavity - Seeking Self-Awareness Node (ORANGE/YELLOW) -->
  <ellipse cx="400" cy="100" rx="60" ry="30" 
           fill="rgba(100,60,20,0.8)" stroke="rgba(255,180,80,0.6)" stroke-width="3"/>
  <ellipse cx="400" cy="100" rx="50" ry="25" 
           fill="rgba(120,70,10,0.9)" stroke="rgba(255,200,100,0.7)" stroke-width="2"/>
  
  <!-- Upper jet (ORANGE/YELLOW) - UNIFORM, very transparent inside sphere -->
  <path d="M 400 130 L 390 825 L 400 825 L 410 825 L 400 130" 
        fill="rgba(255,160,50,0.1)" stroke="rgba(255,180,80,0.3)" stroke-width="3"/>
  <path d="M 400 130 Q 395 477.5 392 825" 
        fill="none" stroke="rgba(255,200,100,0.3)" stroke-width="4"/>
  <path d="M 400 130 Q 405 477.5 408 825" 
        fill="none" stroke="rgba(255,220,120,0.3)" stroke-width="4"/>
  
  <!-- Singularity at SSAN location -->
  <ellipse cx="400" cy="100" rx="40" ry="25" 
           fill="rgba(200,120,150,0.3)" stroke="rgba(255,180,200,0.9)" stroke-width="3"/>
  <circle cx="400" cy="100" r="15" fill="rgba(240,160,180,0.95)"/>
  <circle cx="400" cy="100" r="8" fill="rgba(255,200,200,1)"/>
  
  <!-- Flow arrows -->
  <!-- Purple encompassing flow -->
  <polygon points="370,400 365,415 375,415" fill="rgba(200,140,255,0.7)"/>
  <polygon points="430,400 425,415 435,415" fill="rgba(200,140,255,0.7)"/>
  <polygon points="360,250 355,265 365,265" fill="rgba(200,140,255,0.6)"/>
  <polygon points="440,250 435,265 445,265" fill="rgba(200,140,255,0.6)"/>
  
  <!-- Orange stream arrows -->
  <polygon points="400,200 395,215 405,215" fill="rgba(255,200,100,0.4)"/>
  <polygon points="400,400 395,415 405,415" fill="rgba(255,220,120,0.3)"/>
  <polygon points="400,620 395,635 405,635" fill="rgba(255,220,120,0.3)"/>
  <polygon points="400,750 395,765 405,765" fill="rgba(255,200,100,0.3)"/>
  
  <!-- Purple from SFGN -->
  <polygon points="400,750 395,735 405,735" fill="rgba(200,140,255,0.6)"/>
  <polygon points="400,680 395,665 405,665" fill="rgba(200,140,255,0.6)"/>
  <polygon points="400,500 395,485 405,485" fill="rgba(200,140,255,0.9)"/>
  <polygon points="400,300 395,285 405,285" fill="rgba(200,140,255,0.9)"/>
  
  <!-- Circular flow around singularity - POINTING UP -->
  <polygon points="100,100 110,105 110,95" fill="rgba(255,200,100,0.7)" 
           transform="rotate(90 100 100)"/>
  <polygon points="700,100 690,105 690,95" fill="rgba(255,200,100,0.7)" 
           transform="rotate(-90 700 100)"/>
  
  <!-- Field lines radiating from SSAN/Singularity - ORANGE -->
  <g opacity="0.3">
    <line x1="400" y1="100" x2="200" y2="0" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
    <line x1="400" y1="100" x2="600" y2="0" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
    <line x1="400" y1="100" x2="200" y2="200" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
    <line x1="400" y1="100" x2="600" y2="200" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
  </g>
  
  <!-- Pole highlights -->
  <circle cx="400" cy="100" r="15" fill="rgba(255,200,180,0.4)"/>
  <circle cx="400" cy="825" r="8" fill="rgba(100,0,100,0.6)"/>
  
  <!-- Labels - TOP -->
  <text x="400" y="10" text-anchor="middle" fill="rgba(255,200,100,0.9)" font-family="Arial" font-weight="bold">
    <tspan font-size="14">SEEKING SELF-AWARENESS </tspan>
    <tspan font-size="18">Node</tspan>
  </text>
  <text x="400" y="35" text-anchor="middle" fill="rgba(255,200,100,0.9)" 
        font-size="16" font-family="Arial" font-weight="bold">Harvestable Second-Density Entity</text>
  <text x="400" y="60" text-anchor="middle" fill="rgba(255,200,100,0.9)" 
        font-size="16" font-family="Arial" font-weight="bold">[Advanced 2nd Density]</text>
  
  <!-- Labels - BOTTOM (moved closer to sphere) -->
  <text x="525" y="785" text-anchor="start" fill="rgba(75,0,130,0.95)" font-family="Arial" font-weight="bold">
    <tspan font-size="14">SEEKING FULL-GNOSIS </tspan>
    <tspan font-size="18">Node</tspan>
  </text>
  <text x="525" y="810" text-anchor="start" fill="rgba(75,0,130,0.95)" 
        font-size="16" font-family="Arial" font-style="italic">Mind-Body-Spirit Complex Totality</text>
  <text x="525" y="835" text-anchor="start" fill="rgba(75,0,130,0.95)" 
        font-size="16" font-family="Arial" font-style="italic">[7th Density - Deep Magenta Core]</text>
  
  <!-- New labels - HIGHER SELF (dark blue, bold, moved right) -->
  <text x="510" y="620" text-anchor="start" fill="rgba(0,0,139,0.95)" font-family="Arial" font-weight="bold">
    <tspan font-size="14">SEEKING FULL UNITY </tspan>
    <tspan font-size="18">Node</tspan>
  </text>
  <text x="510" y="645" text-anchor="start" fill="rgba(0,0,139,0.95)" 
        font-size="16" font-family="Arial" font-weight="bold">Higher Self</text>
  <text x="510" y="670" text-anchor="start" fill="rgba(0,0,139,0.95)" 
        font-size="16" font-family="Arial" font-weight="bold">[mid-6th Density]</text>
</svg>