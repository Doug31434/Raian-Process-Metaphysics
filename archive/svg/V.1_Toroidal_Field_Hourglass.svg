<svg viewBox="-100 -50 1000 900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="-100" y="-50" width="1000" height="900" fill="#0a0a1a"/>
  
  <!-- Outer toroidal rings around SSAN/Singularity - ORANGE -->
  <ellipse cx="400" cy="100" rx="350" ry="200" fill="none" stroke="rgba(255,180,80,0.3)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="320" ry="180" fill="none" stroke="rgba(255,190,90,0.4)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="290" ry="160" fill="none" stroke="rgba(255,200,100,0.5)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="260" ry="140" fill="none" stroke="rgba(255,210,110,0.6)" stroke-width="2"/>
  <ellipse cx="400" cy="100" rx="230" ry="120" fill="none" stroke="rgba(255,220,120,0.7)" stroke-width="2"/>
  
  <!-- Lower jet (PURPLE) - EXPANDED to transcend and include orange -->
  <path d="M 400 670 L 340 100 L 400 100 L 460 100 L 400 670" 
        fill="rgba(180,100,255,0.25)" stroke="rgba(190,120,255,0.6)" stroke-width="4"/>
  <path d="M 400 670 Q 360 385 350 100" 
        fill="none" stroke="rgba(200,140,255,0.7)" stroke-width="6"/>
  <path d="M 400 670 Q 440 385 450 100" 
        fill="none" stroke="rgba(200,140,255,0.7)" stroke-width="6"/>
  
  <!-- Purple surrounding SSAN cavity -->
  <ellipse cx="400" cy="100" rx="100" ry="55" 
           fill="none" stroke="rgba(180,120,255,0.5)" stroke-width="3"/>
  <ellipse cx="400" cy="100" rx="110" ry="60" 
           fill="none" stroke="rgba(180,120,255,0.4)" stroke-width="2"/>
  
  <!-- Lower cavity - Seeking Full-Gnosis Node (PURPLE outer, ORANGE inner) -->
  <ellipse cx="400" cy="700" rx="60" ry="30" 
           fill="rgba(60,20,80,0.8)" stroke="rgba(150,80,200,0.6)" stroke-width="3"/>
  <ellipse cx="400" cy="700" rx="50" ry="25" 
           fill="rgba(120,70,10,0.9)" stroke="rgba(255,200,100,0.7)" stroke-width="2"/>
  
  <!-- Upper cavity - Seeking Self-Awareness Node (ORANGE/YELLOW) -->
  <ellipse cx="400" cy="100" rx="60" ry="30" 
           fill="rgba(100,60,20,0.8)" stroke="rgba(255,180,80,0.6)" stroke-width="3"/>
  <ellipse cx="400" cy="100" rx="50" ry="25" 
           fill="rgba(120,70,10,0.9)" stroke="rgba(255,200,100,0.7)" stroke-width="2"/>
  
  <!-- Upper jet (ORANGE/YELLOW) - EXTENDED ALL THE WAY TO SFGN -->
  <path d="M 400 130 L 390 700 L 400 700 L 410 700 L 400 130" 
        fill="rgba(255,160,50,0.4)" stroke="rgba(255,180,80,0.8)" stroke-width="3"/>
  <path d="M 400 130 Q 395 415 392 700" 
        fill="none" stroke="rgba(255,200,100,0.9)" stroke-width="4"/>
  <path d="M 400 130 Q 405 415 408 700" 
        fill="none" stroke="rgba(255,220,120,0.9)" stroke-width="4"/>
  
  <!-- Singularity at SSAN location -->
  <ellipse cx="400" cy="100" rx="40" ry="25" 
           fill="rgba(200,120,150,0.3)" stroke="rgba(255,180,200,0.9)" stroke-width="3"/>
  <circle cx="400" cy="100" r="15" fill="rgba(240,160,180,0.95)"/>
  <circle cx="400" cy="100" r="8" fill="rgba(255,200,200,1)"/>
  
  <!-- Flow arrows -->
  <!-- Purple encompassing flow -->
  <polygon points="370,400 365,415 375,415" fill="rgba(200,140,255,0.7)"/>
  <polygon points="430,400 425,415 435,415" fill="rgba(200,140,255,0.7)"/>
  <polygon points="360,250 355,265 365,265" fill="rgba(200,140,255,0.6)"/>
  <polygon points="440,250 435,265 445,265" fill="rgba(200,140,255,0.6)"/>
  
  <!-- Orange stream arrows -->
  <polygon points="400,200 395,215 405,215" fill="rgba(255,200,100,0.95)"/>
  <polygon points="400,300 395,315 405,315" fill="rgba(255,220,120,0.95)"/>
  
  <!-- Purple from SFGN -->
  <polygon points="400,600 395,585 405,585" fill="rgba(200,140,255,0.9)"/>
  
  <!-- Circular flow around singularity - POINTING UP -->
  <polygon points="100,100 110,105 110,95" fill="rgba(255,200,100,0.7)" 
           transform="rotate(90 100 100)"/>
  <polygon points="700,100 690,105 690,95" fill="rgba(255,200,100,0.7)" 
           transform="rotate(-90 700 100)"/>
  
  <!-- Field lines radiating from SSAN/Singularity - ORANGE -->
  <g opacity="0.3">
    <line x1="400" y1="100" x2="200" y2="0" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
    <line x1="400" y1="100" x2="600" y2="0" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
    <line x1="400" y1="100" x2="200" y2="200" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
    <line x1="400" y1="100" x2="600" y2="200" stroke="rgba(255,200,100,0.8)" stroke-width="1"/>
  </g>
  
  <!-- Pole highlights -->
  <circle cx="400" cy="100" r="15" fill="rgba(255,200,180,0.4)"/>
  <circle cx="400" cy="700" r="15" fill="rgba(200,140,255,0.6)"/>
  
  <!-- Labels -->
  <text x="400" y="40" text-anchor="middle" fill="rgba(255,200,100,0.9)" 
        font-size="16" font-family="Arial" font-weight="bold">Seeking Self-Awareness Node</text>
  <text x="400" y="145" text-anchor="middle" fill="rgba(255,200,200,0.9)" 
        font-size="14" font-family="Arial" font-style="italic">Singularity</text>
  <text x="400" y="760" text-anchor="middle" fill="rgba(200,140,255,0.9)" 
        font-size="16" font-family="Arial" font-weight="bold">Seeking Full-Gnosis Node</text>
  <text x="400" y="780" text-anchor="middle" fill="rgba(200,140,255,0.9)" 
        font-size="14" font-family="Arial">(SFGN)</text>
</svg>